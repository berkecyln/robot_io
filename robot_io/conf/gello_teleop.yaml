defaults:
  - robot: panda_franky_interface_policy
  - input: gello
  - cams: camera_manager
  - _self_

hydra:
  run:
    dir: .

freq: 60  # teleop loop rate in Hz

calib_save_dir: null  # set to an absolute path to enable [c] calibration pose snapping

# Overrides the one in panda_franky_interface_policy.yaml 
robot:
  franky_params:
    velocity_rel: 0.3
    acceleration_rel: 0.3
    jerk_rel: 0.3
